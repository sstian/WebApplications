<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片旋转控制器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      padding: 20px;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .image-container {
      margin: 30px 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .rotating-image {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      border: 5px solid #fff;
    }

    .controls {
      background-color: #f8f9fa;
      border-radius: 15px;
      padding: 20px;
      margin-top: 20px;
    }

    .control-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 500;
      color: #555;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    input[type="range"] {
      flex: 1;
      height: 8px;
      -webkit-appearance: none;
      background: #ddd;
      border-radius: 5px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: #2575fc;
      border-radius: 50%;
      cursor: pointer;
    }

    .speed-value {
      font-weight: 600;
      color: #2575fc;
      min-width: 40px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    #startBtn {
      background-color: #4CAF50;
      color: white;
    }

    #startBtn:hover {
      background-color: #45a049;
      transform: translateY(-2px);
    }

    #pauseBtn {
      background-color: #ff9800;
      color: white;
    }

    #pauseBtn:hover {
      background-color: #e68900;
      transform: translateY(-2px);
    }

    #resetBtn {
      background-color: #f44336;
      color: white;
    }

    #resetBtn:hover {
      background-color: #da190b;
      transform: translateY(-2px);
    }

    .instructions {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>图片旋转控制器</h1>

    <div class="image-container">
      <img src="https://ix-marketing.imgix.net/bg-remove_after.png?auto=format,compress&w=1946" alt="旋转的图片" class="rotating-image" id="rotatingImage">
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="speedControl">旋转速度控制</label>
        <div class="slider-container">
          <span>慢</span>
          <input type="range" id="speedControl" min="1" max="2000000" value="2000000">
          <span>快</span>
          <span class="speed-value" id="speedValue">10</span>
        </div>
      </div>

      <div class="buttons">
        <button id="startBtn">开始旋转</button>
        <button id="pauseBtn">暂停旋转</button>
        <button id="resetBtn">重置</button>
      </div>
    </div>

    <div class="instructions">
      <p>使用滑块调整旋转速度，点击按钮控制旋转状态。</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const rotatingImage = document.getElementById('rotatingImage');
      const speedControl = document.getElementById('speedControl');
      const speedValue = document.getElementById('speedValue');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const resetBtn = document.getElementById('resetBtn');

      let rotationSpeed = 2000000; // 默认速度
      let isRotating = false;
      let animationId;

      // 更新速度显示
      function updateSpeedDisplay() {
        speedValue.textContent = rotationSpeed;
      }

      // 旋转函数
      function rotateImage() {
        let rotation = 0;

        function animate() {
          if (isRotating) {
            rotation += rotationSpeed / 10;
            rotatingImage.style.transform = `rotate(${rotation}deg)`;
            animationId = requestAnimationFrame(animate);
          }
        }

        animate();
      }

      // 开始旋转
      function startRotation() {
        if (!isRotating) {
          isRotating = true;
          rotateImage();
          startBtn.disabled = true;
          pauseBtn.disabled = false;
        }
      }

      // 暂停旋转
      function pauseRotation() {
        isRotating = false;
        cancelAnimationFrame(animationId);
        startBtn.disabled = false;
        pauseBtn.disabled = true;
      }

      // 重置旋转
      function resetRotation() {
        pauseRotation();
        rotatingImage.style.transform = 'rotate(0deg)';
        speedControl.value = 2000000;
        rotationSpeed = 2000000;
        updateSpeedDisplay();
      }

      // 事件监听
      speedControl.addEventListener('input', function () {
        rotationSpeed = parseInt(this.value);
        updateSpeedDisplay();
      });

      startBtn.addEventListener('click', startRotation);
      pauseBtn.addEventListener('click', pauseRotation);
      resetBtn.addEventListener('click', resetRotation);

      // 初始化
      updateSpeedDisplay();
      pauseBtn.disabled = true;
    });
  </script>
</body>

</html>
